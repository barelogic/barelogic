name: stats

on:
  schedule:
    - cron: "17 0 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch JetBrains Mono (cached by commit)
        run: |
          mkdir -p scripts/fonts
          if [ ! -f scripts/fonts/JetBrainsMono-Regular.ttf ]; then
            curl -Lso scripts/fonts/JetBrainsMono-Regular.ttf \
              https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Regular.ttf
          fi

      - name: Generate graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          if [ -f assets/portrait.jpg ] || [ -f assets/portrait.png ]; then
            IMG=$(ls assets/portrait.* | head -1)
            python scripts/make_portrait.py --input "$IMG" --output ascii.svg
          else
            python scripts/make_portrait.py --output ascii.svg
          fi
          python scripts/generate_stats.py

      - name: Commit only what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ascii.svg stats.svg streak.svg langs.svg year.svg hd-*.svg \
            scripts/fonts/JetBrainsMono-Regular.ttf || true
          git diff --quiet --cached && echo "no changes" || (git commit -m "chore: refresh generated SVGs" && git push)
